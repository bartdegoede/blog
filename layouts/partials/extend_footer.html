{{- /* Homepage inline search functionality */ -}}
{{- if .IsHome }}
<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.1.0" data-cf-async="false"></script>
{{- $js := resources.Get "js/semantic/index.js" | js.Build (dict "minify" true "target" "es2017" "format" "esm") | fingerprint -}}
<script type="module" src="{{ $js.RelPermalink }}" integrity="{{ $js.Data.Integrity }}" data-cf-async="false"></script>
<script type="module" data-cf-async="false">
import { loadIndex, searchSemantic, searchHybrid, getChunks, MIN_SCORE } from "{{ $js.RelPermalink }}";

document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('searchInput');
    const searchResults = document.getElementById('searchResults');
    const allPosts = document.getElementById('allPosts');

    if (!searchInput) return;

    // Escape arbitrary text before interpolating it into a template literal.
    // item.title comes from our own front matter, but chunk snippets are
    // arbitrary prose pulled straight from post bodies, so both need this.
    function esc(str) {
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    let searchIndex = null;
    let pagesIndex = null;

    // --- Mode toggle: keyword / semantic / hybrid -----------------------
    //
    // layouts/index.html renders #searchInput/#searchResults/#allPosts, but
    // this partial isn't allowed to touch that file, so the toggle is built
    // here and spliced in above #searchResults instead of in the template.
    const MODE_KEY = 'search-mode';
    const MODES = ['keyword', 'semantic', 'hybrid'];
    let mode = localStorage.getItem(MODE_KEY);
    if (!MODES.includes(mode)) mode = 'hybrid';

    const modeToggle = document.createElement('div');
    modeToggle.className = 'search-modes';
    // Hidden until a query is active, so it never pushes #allPosts down.
    modeToggle.style.display = 'none';
    // The label sits outside the radiogroup and names it, so assistive tech
    // reads exactly three radios rather than a stray span among them.
    modeToggle.innerHTML =
        '<span class="search-modes-label" id="search-mode-label">Search mode:</span>' +
        '<div class="search-modes-options" role="radiogroup" aria-labelledby="search-mode-label">' +
        MODES.map(function(m) {
            return '<button type="button" data-mode="' + m + '" role="radio" aria-checked="' + (m === mode) + '">' + m + '</button>';
        }).join('') +
        '</div>';
    searchResults.parentNode.insertBefore(modeToggle, searchResults);

    function updateToggleUI() {
        modeToggle.querySelectorAll('button').forEach(function(btn) {
            btn.setAttribute('aria-checked', String(btn.dataset.mode === mode));
        });
    }
    updateToggleUI();

    function setMode(newMode) {
        mode = newMode;
        localStorage.setItem(MODE_KEY, mode);
        updateToggleUI();
        runSearch(searchInput.value.trim());
    }

    modeToggle.addEventListener('click', function(e) {
        const btn = e.target.closest('button[data-mode]');
        if (!btn || btn.disabled) return;
        setMode(btn.dataset.mode);
    });

    // --- Lazy-load the semantic index on first focus --------------------
    //
    // Do not await this here: keyword mode must stay instant. The promise
    // is memoized so a second focus (or a mode switch before it resolves)
    // never triggers a second fetch.
    let semanticIndexPromise = null;
    let semanticReady = false;
    let semanticFailed = false;

    function disableSemanticModes(err) {
        console.error('Failed to load semantic search index:', err);
        semanticFailed = true;
        modeToggle.querySelectorAll('button[data-mode="semantic"], button[data-mode="hybrid"]').forEach(function(btn) {
            btn.disabled = true;
            btn.title = 'Semantic search unavailable (index failed to load)';
        });
        if (mode !== 'keyword') {
            mode = 'keyword';
            updateToggleUI();
        }
    }

    function ensureSemanticIndex() {
        if (!semanticIndexPromise) {
            semanticIndexPromise = loadIndex()
                .then(function(idx) {
                    semanticReady = true;
                    return idx;
                })
                .catch(function(err) {
                    disableSemanticModes(err);
                    throw err;
                });
        }
        return semanticIndexPromise;
    }

    searchInput.addEventListener('focus', function() {
        ensureSemanticIndex().catch(function() { /* already logged/handled */ });
    }, { once: true });

    // --- Keyword (Fuse.js) index load ------------------------------------
    fetch('/index.json')
        .then(response => response.json())
        .then(data => {
            pagesIndex = data;

            // Initialize Fuse.js for fuzzy search.
            // ignoreLocation is required: with the default location/distance scoring,
            // a match more than ~1000 characters into a field scores too poorly to
            // survive the threshold, so terms appearing only in the body of a long
            // post (pydub, mmh3, hnsw) were unfindable.
            const fuseOptions = {
                isCaseSensitive: false,
                shouldSort: true,
                ignoreLocation: true,
                threshold: 0.2,
                minMatchCharLength: 2,
                keys: [
                    { name: 'title', weight: 0.8 },
                    { name: 'content', weight: 0.5 },
                    { name: 'categories', weight: 0.3 }
                ]
            };

            searchIndex = new Fuse(data, fuseOptions);
        })
        .catch(error => console.error('Error loading search index:', error));

    // --- Rendering ---------------------------------------------------

    // At most this many result cards. Semantic search ranks all 13 posts; the
    // reader wants the top of that ranking, not a re-ordered table of contents.
    const MAX_RESULTS = 8;

    function renderCountHtml(shown, total) {
        const label = shown < total
            ? 'Top ' + shown + ' of ' + total + ' ranked'
            : 'Found ' + shown + ' result' + (shown === 1 ? '' : 's');
        return '<div style="margin-bottom: 1.5rem; color: var(--secondary); font-size: 0.95rem;">' + label + '</div>';
    }

    // Footnote markers (`[^faiss]`) survive into chunk snippets by design -- the
    // downstream WordPiece tokenizer drops the brackets, so they cost the
    // embedding nothing. They just look like debris to a reader.
    function cleanSnippet(text, max) {
        return text.replace(/\[\^[^\]]+\]/g, '').replace(/\s+/g, ' ').trim().substring(0, max) + '...';
    }

    function showNoResults(query) {
        searchResults.innerHTML = '<p style="color: var(--secondary); padding: 1rem 0;">No results found for "' + esc(query) + '"</p>';
    }

    function showLoading() {
        searchResults.innerHTML = '<p style="color: var(--secondary);">Loading semantic index&hellip;</p>';
    }

    function slugFromHref(href) {
        return new URL(href).pathname.replace(/^\/|\/$/g, '');
    }

    function renderKeywordHtml(results) {
        if (results.length === 0) return null;

        let html = renderCountHtml(Math.min(results.length, MAX_RESULTS), results.length);

        results.slice(0, MAX_RESULTS).forEach(result => {
            const item = result.item;
            const snippet = item.content ? item.content.substring(0, 150).replace(/\n/g, ' ').trim() + '...' : '';

            html += `
                <article class="post-entry">
                    <header class="entry-header">
                        <h2 class="entry-hint-parent">${esc(item.title)}</h2>
                    </header>
                    ${snippet ? `<div class="entry-content"><p>${esc(snippet)}</p></div>` : ''}
                    ${item.categories && item.categories.length > 0 ? `<footer class="entry-footer">${esc(item.categories.join(', '))}</footer>` : ''}
                    <a class="entry-link" aria-label="post link to ${esc(item.title)}" href="${item.href}"></a>
                </article>
            `;
        });

        return html;
    }

    // Semantic/hybrid results are ranked post slugs, not chunk records, so
    // they need a display record. getChunks() returns all 313 chunk rows;
    // for a given slug we want the *winning* chunk's snippet (the one that
    // actually produced the post's score).
    //
    // TODO: searchSemantic/searchHybrid roll per-chunk scores up to one
    // best-per-post entry via rollupToPosts() and discard which chunk won,
    // so we can't recover it here. As a placeholder we take the *first*
    // chunk record whose post === slug, which is frequently not the chunk
    // that matched. Surfacing the real winning chunk needs
    // rollupToPosts(..., {withIndex: true}) returning the winning row index
    // alongside the score, which Part 3 can add.
    async function renderSemanticHtml(ranked) {
        if (ranked.length === 0) return null;

        const chunks = await getChunks();
        let html = renderCountHtml(Math.min(ranked.length, MAX_RESULTS), ranked.length);

        ranked.slice(0, MAX_RESULTS).forEach(([slug]) => {
            const chunk = chunks.find(c => c.post === slug);
            if (!chunk) return;

            const snippet = chunk.snippet ? cleanSnippet(chunk.snippet, 180) : '';

            html += `
                <article class="post-entry">
                    <header class="entry-header">
                        <h2 class="entry-hint-parent">${esc(chunk.title)}</h2>
                    </header>
                    ${snippet ? `<div class="entry-content"><p>${esc(snippet)}</p></div>` : ''}
                    <a class="entry-link" aria-label="post link to ${esc(chunk.title)}" href="${chunk.href}"></a>
                </article>
            `;
        });

        return html;
    }

    // Guards against a slow, stale search (e.g. an in-flight semantic
    // lookup) clobbering the result of a newer one that finished first.
    let searchToken = 0;

    async function runSearch(query) {
        const myToken = ++searchToken;

        if (query.length < 2) {
            searchResults.innerHTML = '';
            searchResults.style.display = 'none';
            modeToggle.style.display = 'none';
            allPosts.style.display = 'block';
            return;
        }

        allPosts.style.display = 'none';
        searchResults.style.display = 'block';
        modeToggle.style.display = '';

        const effectiveMode = semanticFailed ? 'keyword' : mode;

        if (effectiveMode === 'keyword') {
            if (!searchIndex) {
                searchResults.innerHTML = '<p style="color: var(--secondary);">Loading search index...</p>';
                return;
            }
            const html = renderKeywordHtml(searchIndex.search(query));
            if (myToken !== searchToken) return;
            if (html === null) { showNoResults(query); return; }
            searchResults.innerHTML = html;
            return;
        }

        // semantic or hybrid
        const idxPromise = ensureSemanticIndex();
        if (!semanticReady) {
            showLoading();
        }

        try {
            await idxPromise;
        } catch (e) {
            // disableSemanticModes() already flipped mode to 'keyword'.
            if (myToken !== searchToken) return;
            return runSearch(query);
        }
        if (myToken !== searchToken) return;

        let ranked;
        if (effectiveMode === 'semantic') {
            ranked = await searchSemantic(query, { minScore: MIN_SCORE });
        } else {
            const keywordRanking = searchIndex
                ? searchIndex.search(query).map(r => slugFromHref(r.item.href))
                : [];
            ranked = await searchHybrid(query, keywordRanking, { minScore: MIN_SCORE });
        }
        if (myToken !== searchToken) return;

        const html = await renderSemanticHtml(ranked);
        if (myToken !== searchToken) return;
        if (html === null) { showNoResults(query); return; }
        searchResults.innerHTML = html;
    }

    // Handle search input
    searchInput.addEventListener('input', function(e) {
        runSearch(e.target.value.trim());
    });

    // Clear search on ESC key
    searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            searchInput.value = '';
            searchResults.innerHTML = '';
            searchResults.style.display = 'none';
            modeToggle.style.display = 'none';
            allPosts.style.display = 'block';
        }
    });
});
</script>
{{- end }}
<script data-cf-async="false">
document.addEventListener('DOMContentLoaded', function () {
    function fmt(t) {
        if (!isFinite(t)) t = 0;
        var m = Math.floor(t / 60), s = Math.floor(t % 60);
        return m + ':' + (s < 10 ? '0' : '') + s;
    }
    document.querySelectorAll('.tts-player').forEach(function (player) {
        var audio = player.querySelector('.tts-audio');
        var playBtn = player.querySelector('.tts-play');
        var timeEl = player.querySelector('.tts-time');
        var speedSel = player.querySelector('.tts-speed');
        var wave = player.querySelector('.tts-waveform');
        var clip = player.querySelector('.wf-clip');
        var svg = player.querySelector('svg.wf');
        var n = svg ? svg.viewBox.baseVal.width : 0;

        // GA4 engagement tracking. Guarded on gtag so it stays silent when a
        // visitor has Do-Not-Track on (the site's gtag setup leaves gtag
        // undefined in that case). The track label comes from the original
        // (pre-fingerprint) src, so it's stable across audio re-renders.
        var track = player.getAttribute('data-track') || 'unknown';
        function ga(name, params) {
            if (typeof gtag !== 'function') { return; }
            gtag('event', name, Object.assign({ audio_track: track }, params || {}));
        }
        var playSent = false;
        var milestones = [25, 50, 75];
        var milestoneSent = {};

        function update() {
            timeEl.textContent = fmt(audio.currentTime) + ' / ' + fmt(audio.duration);
            if (clip && n && audio.duration) {
                clip.setAttribute('width', (audio.currentTime / audio.duration) * n);
            }
            if (audio.duration) {
                var pct = (audio.currentTime / audio.duration) * 100;
                milestones.forEach(function (m) {
                    if (pct >= m && !milestoneSent[m]) {
                        milestoneSent[m] = true;
                        ga('audio_progress', { percent: m });
                    }
                });
            }
        }
        playBtn.addEventListener('click', function () {
            if (audio.paused) { audio.play(); } else { audio.pause(); }
        });
        audio.addEventListener('play', function () {
            playBtn.innerHTML = '&#10074;&#10074;'; playBtn.setAttribute('aria-label', 'Pause');
            if (!playSent) { playSent = true; ga('audio_play'); }
        });
        audio.addEventListener('pause', function () { playBtn.innerHTML = '&#9654;'; playBtn.setAttribute('aria-label', 'Play'); });
        audio.addEventListener('ended', function () { playBtn.innerHTML = '&#9654;'; ga('audio_complete'); });
        audio.addEventListener('timeupdate', update);
        audio.addEventListener('loadedmetadata', update);
        wave.addEventListener('click', function (e) {
            if (!audio.duration) { return; }
            var r = wave.getBoundingClientRect();
            var f = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
            audio.currentTime = f * audio.duration;
        });
        speedSel.addEventListener('change', function () {
            audio.playbackRate = parseFloat(speedSel.value);
        });
        update();
    });
});
</script>
