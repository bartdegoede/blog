<svg class="viz" viewBox="0 0 680 420" role="img" aria-labelledby="viz-loss-answers-t viz-loss-answers-d" xmlns="http://www.w3.org/2000/svg">
<title id="viz-loss-answers-t">Validation loss improves while the answers get worse</title><desc id="viz-loss-answers-d">Validation loss per checkpoint: 0.804, 0.778, 0.760, 0.740. Faithful answers on the blog (of 30): 18, 11, 9; 17 before fine-tuning.</desc>
