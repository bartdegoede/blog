# Surface form -> spoken form. Case-sensitive, whole-token, longest-match-first.
# Grow this whenever Kokoro mispronounces a term in a post.
# Note: "<name>.js" is spelled "<name> J S" and "~123" becomes "approximately"
# by rules in lexicon.py, so those don't need entries here.
# Symbols map to space-padded words so "±250" reads as "approximately 250".
"±": " approximately "
"×": " times "
"%": " percent "
